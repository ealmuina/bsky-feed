x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  api:
    build:
      context: .
    ports:
      - "3333:3333"
    volumes:
      - .:/app
    command: sh ./run.sh
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    command: >
      -c shared_buffers=4GB
      -c max_wal_size=8GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/db/db_init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    logging: *default-logging

  db-exporter:
    image: prometheuscommunity/postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgres://postgres:postgres@db/bsky_feeds?sslmode=disable"
    command: '--no-collector.stat_bgwriter'
    depends_on:
      prometheus:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Host disk is tight (~200GB); Postgres alone holds ~160GB. 15d of
      # TSDB costs ~9GB — 3d is plenty for ops dashboards on this host.
      - '--storage.tsdb.retention.time=3d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
